name: Daily Likes Boost
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  boost-likes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boost likes with weighted random
        run: |
          FILE="likes.json"
          TRACKER="daily-boost.json"
          TODAY=$(date -u +%Y-%m-%d)
          CAP=15

          if [ -f "$TRACKER" ]; then
            tracker_date=$(jq -r '.date // ""' "$TRACKER")
          else
            tracker_date=""
          fi

          if [ "$tracker_date" != "$TODAY" ]; then
            echo '{"date":"'"$TODAY"'","bark-game":0,"buaa-schedule":0,"fox-a":0,"navivisor":0,"schedule-cockpit":0}' > "$TRACKER"
          fi

          changed=false
          for key in bark-game buaa-schedule fox-a navivisor schedule-cockpit; do
            today_count=$(jq -r ".[\"$key\"] // 0" "$TRACKER")
            if [ "$today_count" -ge "$CAP" ]; then
              echo "$key: daily cap reached ($today_count/$CAP)"
              continue
            fi

            r=$((RANDOM % 100))
            if [ $r -lt 50 ]; then
              boost=0
            elif [ $r -lt 80 ]; then
              boost=1
            elif [ $r -lt 90 ]; then
              boost=2
            else
              boost=3
            fi

            if [ $boost -eq 0 ]; then
              echo "$key: +0"
              continue
            fi

            remaining=$((CAP - today_count))
            if [ $boost -gt $remaining ]; then
              boost=$remaining
            fi

            current=$(jq -r ".[\"$key\"] // 0" "$FILE")
            new=$((current + boost))
            jq ".[\"$key\"] = $new" "$FILE" > tmp.json && mv tmp.json "$FILE"
            jq ".[\"$key\"] = $((today_count + boost))" "$TRACKER" > tmp.json && mv tmp.json "$TRACKER"
            echo "$key: +$boost (today: $((today_count + boost))/$CAP, total: $new)"
            changed=true
          done

          if [ "$changed" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add likes.json daily-boost.json
            git diff --cached --quiet || git commit -m "bot: hourly likes boost"
            git push
          else
            echo "No changes to commit."
          fi
